<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Application Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 20px;
    }
    .form-container {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .form-container h2 {
      text-align: center;
      color: #333333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .submit-btn {
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Job Application Form</h2>

    <!-- Formspree Endpoint with Resume Upload enabled -->
    <form action="https://formspree.io/f/mdeorbyd" method="POST" enctype="multipart/form-data">
      
      <!-- Full Name -->
      <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter Full Name" required>
      </div>

      <!-- Email Address -->
      <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="_replyto" placeholder="Enter Email Address" required>
      </div>

      <!-- Candidate ID / Username -->
      <div class="form-group">
        <label for="username">Username / Candidate ID:</label>
        <input type="text" id="username" name="username" placeholder="Enter Candidate ID" required>
      </div>

      <!-- Resume Upload -->
      <div class="form-group">
        <label for="resume">Upload Resume (PDF, DOC, DOCX):</label>
        <input type="file" id="resume" name="attachment" accept=".pdf,.doc,.docx" required>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Submit Application</button>

    </form>
  </div>

</body>
</html>
